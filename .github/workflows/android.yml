name: Compilar APK de Cine Final

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el repositorio limpio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias de Node si existen
      run: |
        if [ -f "package.json" ]; then
          npm install
        fi

    - name: Crear Keystore de depuración automático
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p app
        cp debug.keystore app/debug.keystore

    - name: Generar ejecutor Gradle si no existe y dar permisos
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "Generando gradle wrapper..."
          gradle wrapper
        fi
        chmod +x ./gradlew

    - name: Compilar APK en modo desatendido (CI)
      run: |
        ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Djava.awt.headless=true"

    - name: Guardar la APK de Cine generada
      uses: actions/upload-artifact@v4
      with:
        name: Cine-APK-Instalable
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/debug/*.apk
